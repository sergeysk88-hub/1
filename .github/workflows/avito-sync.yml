# Раз в день подтягивает с Авито отзывы, цены и контакты (tools/avito-sync.mjs)
# и, если что-то изменилось, коммитит обновлённый index.html.
# Нужны секреты репозитория AVITO_CLIENT_ID и AVITO_CLIENT_SECRET
# (Settings → Secrets and variables → Actions). Без них запуск просто пропускается.
name: Синхронизация с Авито

on:
  schedule:
    - cron: '17 3 * * *' # каждый день в 06:17 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avito-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Проверить ключи
        id: keys
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          if [ -n "$AVITO_CLIENT_ID" ] && [ -n "$AVITO_CLIENT_SECRET" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Секреты AVITO_CLIENT_ID и AVITO_CLIENT_SECRET не заданы — синхронизация пропущена"
          fi

      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Загрузить данные с Авито
        if: steps.keys.outputs.ok == 'true'
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: node tools/avito-sync.mjs

      # Заодно проверяет, что в index.html не попало посторонних <script> и JSON не сломан
      - name: Проверить index.html
        if: steps.keys.outputs.ok == 'true'
        run: node tools/update-csp.mjs

      - name: Сохранить изменения
        if: steps.keys.outputs.ok == 'true'
        run: |
          if git diff --quiet; then echo "Изменений нет"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Обновить отзывы, цены и контакты с Авито"
          git push
